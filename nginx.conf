server {
    listen 80;
    server_name www.reshra.xyz reshra.xyz localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # TLS terminates at the public proxy; preserve its scheme on clean-URL redirects.
    absolute_redirect off;

    if ($request_uri ~ "^(/[^?]+?)/+(?:\?.*)?$") {
        return 301 $1$is_args$args;
    }

    if ($host = www.reshra.xyz) {
        return 301 https://reshra.xyz$request_uri;
    }

    if ($request_uri ~ "^/index\.html(?:\?.*)?$") {
        return 301 /$is_args$args;
    }

    if ($request_uri ~ "^/([^?]+)\.html(?:\?.*)?$") {
        return 301 /$1$is_args$args;
    }

    location = / {
        try_files /index.html =404;
        expires 5m;
    }

    location / {
        try_files $uri $uri.html =404;
        expires 5m;
    }

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 5m;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 5m;
    }

    location = /feed.xml {
        try_files $uri =404;
        expires 5m;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
