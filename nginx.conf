server {
    listen 80;
    server_name www.reshra.xyz reshra.xyz localhost;
    root /usr/share/nginx/html;
    index index.html;

    if ($host = www.reshra.xyz) {
        return 301 https://reshra.xyz$request_uri;
    }

    location / {
        try_files $uri $uri.html =404;
        expires 5m;
    }

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 5m;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 5m;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
